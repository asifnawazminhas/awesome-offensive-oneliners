site_name: Awesome Offensive OneLiners
site_description: A practical collection of one-line commands for penetration testing, Active Directory, red teaming, web security and offensive security operations.
site_author: Asif Nawaz Minhas
site_url: https://oneliners.asifnawazminhas.com/
repo_name: asifnawazminhas/awesome-offensive-oneliners
repo_url: https://github.com/asifnawazminhas/awesome-offensive-oneliners
edit_uri: edit/main/docs/
copyright: Copyright &copy; Asif Nawaz Minhas

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

plugins:
  - search:
      separator: '[\s\-\._/]+'

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - assets/stylesheets/extra.css?v=9
extra_javascript:
  - assets/javascripts/extra.js?v=9
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/asifnawazminhas/awesome-offensive-oneliners
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/asifminhasnl/
  generator: false

