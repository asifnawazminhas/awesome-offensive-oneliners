site_name: Awesome Offensive OneLiners
site_description: A practical collection of one-line commands for penetration testing, Active Directory, red teaming, web security and offensive security operations.
site_author: Asif Nawaz Minhas
site_url: https://oneliners.asifnawazminhas.com/
repo_name: asifnawazminhas/awesome-offensive-oneliners
repo_url: https://github.com/asifnawazminhas/awesome-offensive-oneliners
edit_uri: edit/main/docs/
copyright: Copyright &copy; Asif Nawaz Minhas

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

plugins:
  - search:
      separator: '[\s\-\._/]+'

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  # Required for Material and Octicons used throughout the navigation cards.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/extra.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/asifnawazminhas/awesome-offensive-oneliners
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/asifminhasnl/
  generator: false

nav:
  - Home: index.md
  - Active Directory:
      - Overview: active-directory/index.md
      - Enumeration: active-directory/enumeration.md
      - Kerberos: active-directory/kerberos.md
      - Delegation: active-directory/delegation.md
      - AD CS: active-directory/adcs.md
      - BloodHound: active-directory/bloodhound.md
  - Windows:
      - Overview: windows/index.md
      - Enumeration: windows/enumeration.md
      - App Control: windows/app-control.md
      - Services & Registry: windows/services-registry.md
      - PowerShell: windows/powershell.md
  - Linux:
      - Overview: linux/index.md
      - Enumeration: linux/enumeration.md
      - Privilege Escalation: linux/privilege-escalation.md
      - Networking & Files: linux/networking-files.md
  - Web:
      - Overview: web/index.md
      - Recon: web/recon.md
      - Authentication: web/authentication.md
      - APIs: web/api.md
      - Injection: web/injection.md
  - Recon:
      - Overview: recon/index.md
      - DNS & Subdomains: recon/dns-subdomains.md
      - HTTP & Content: recon/http-content.md
      - Nmap: recon/nmap.md
  - Red Team:
      - Overview: red-team/index.md
      - Discovery: red-team/discovery.md
      - Execution: red-team/execution.md
      - Lateral Movement: red-team/lateral-movement.md
      - Tunneling: red-team/tunneling.md
  - Credentials:
      - Overview: credentials/index.md
      - Kerberos: credentials/kerberos.md
      - Hashes: credentials/hashes.md
      - NTLM & DPAPI: credentials/ntlm-dpapi.md
  - Tools:
      - Overview: tools/index.md
      - NetExec: tools/netexec.md
      - Impacket: tools/impacket.md
      - PowerView & Rubeus: tools/powerview-rubeus.md
      - Certipy & BloodHound: tools/certipy-bloodhound.md
      - curl & jq: tools/curl-jq.md
  - Contributing: contributing.md
