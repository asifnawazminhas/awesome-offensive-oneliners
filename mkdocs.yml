site_name: Awesome Offensive OneLiners
site_description: Practical one-line commands for penetration testing, Active Directory, red teaming, web security and offensive security operations.
site_author: Asif Nawaz Minhas
site_url: https://oneliners.asifnawazminhas.com/

repo_name: asifnawazminhas/awesome-offensive-oneliners
repo_url: https://github.com/asifnawazminhas/awesome-offensive-oneliners

copyright: Copyright &copy; Asif Nawaz Minhas

theme:
  name: material

  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy

  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

nav:
  - Home: index.md
